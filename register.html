<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Ganga AI Forecasting</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

height:100vh;

background:linear-gradient(135deg,#001d3d,#00509d,#00b4d8);

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}

.background{

position:absolute;
width:100%;
height:100%;

background:
radial-gradient(circle at top right,rgba(255,255,255,0.15),transparent 40%),
radial-gradient(circle at bottom left,rgba(255,255,255,0.12),transparent 35%);

z-index:-1;

}

.register-container{

width:450px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(15px);

border-radius:20px;

padding:40px;

box-shadow:0 10px 30px rgba(0,0,0,0.35);

color:white;

}

.logo{

text-align:center;

font-size:55px;

margin-bottom:10px;

color:#90e0ef;

}

h1{

text-align:center;

margin-bottom:10px;

font-size:30px;

}

.subtitle{

text-align:center;

font-size:15px;

margin-bottom:25px;

color:#dbefff;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.input-group input{

width:100%;

padding:12px;

border:none;

border-radius:10px;

outline:none;

font-size:15px;

}

.btn{

width:100%;

padding:13px;

background:#00b4d8;

border:none;

border-radius:10px;

font-size:17px;

font-weight:bold;

color:white;

cursor:pointer;

transition:.3s;

}

.btn:hover{

background:#0077b6;

}

.links{

margin-top:20px;

text-align:center;

}

.links a{

color:#90e0ef;

font-weight:bold;

text-decoration:none;

}

.links a:hover{

text-decoration:underline;

}

.footer{

margin-top:25px;

text-align:center;

font-size:13px;

color:#dbefff;

}

</style>

</head>

<body>

<div class="background"></div>

<div class="register-container">

<div class="logo">

<i class="fa-solid fa-water"></i>

</div>

<h1>Ganga AI Forecasting</h1>

<p class="subtitle">

Create your account to access the AI Enabled Ganga River Water Quality Forecasting System

</p>

<form action="/register" method="POST">

<div class="input-group">

<label>

<i class="fa-solid fa-user"></i>

Username

</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

</div>

<div class="input-group">

<label>

<i class="fa-solid fa-envelope"></i>

Email

</label>

<input
type="email"
name="email"
placeholder="Enter Email"
required>

</div>

<div class="input-group">

<label>

<i class="fa-solid fa-lock"></i>

Password

</label>

<input
type="password"
name="password"
placeholder="Create Password"
required>

</div>

<button class="btn" type="submit">

<i class="fa-solid fa-user-plus"></i>

 Register

</button>

</form>

<div class="links">

<p style="margin-top:20px;">Already have an account?

<a href="/">

Login Here

</a>

</p>

</div>

<div class="footer">

© 2026 Ganga AI Forecasting

</div>

</div>

</body>

</html>
